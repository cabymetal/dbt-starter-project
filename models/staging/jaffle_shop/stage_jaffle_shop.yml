version: 2

models:
  - name: stg_jaffle_shop__customers
    description: one unique customer per row
    columns:
      - name: customer_id
        description: this is the primary key
        data_tests:
          - unique
          - not_null
  - name: stg_jaffle_shop__orders
    description: one order per row
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: status
        description: "{{ doc('order_status') }}" 
        data_tests:
          - accepted_values:
              values: ['placed', 'returned', 'shipped', 'completed', 'return_pending']
      - name: customer_id
        tests:
          - relationships:
              to: ref('stg_jaffle_shop__customers')
              field: customer_id
          