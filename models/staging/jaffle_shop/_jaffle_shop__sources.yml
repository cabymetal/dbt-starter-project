version: 2

sources:
  - name: jaffle_shop
    database: workspace  
    schema: default  
    freshness: 
      error_after: { count: 2, period: day}
      warn_after: {count: 1, period: day}
    loaded_at_field: loaded_timestamp
    tables:
      - name: jaffle_shop_orders
        columns:
          - name: id
            tests:
              - unique
              - not_null
      - name: jaffle_shop_customers
        columns:
          - name: id
            tests:
              - unique
              - not_null
        freshness:
          warn_after: {count: 3, period: hour}
          error_after: {count: 5, period: day}
        loaded_at_field: loaded_timestamp
