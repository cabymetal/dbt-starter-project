version: 2

sources:
  - name: jaffle_shop
    database: workspace  
    schema: default  
    freshness: 
      error_after: { count: 2, period: day}
      warn_after: {count: 1, period: day}
    tables:
      - name: jaffle_shop_orders
      - name: jaffle_shop_customers
        freshness:
          warn_after: {count: 3, period: hour}
          error_after: {count: 5, period: day}
        loaded_at_field: loaded_timestamp
